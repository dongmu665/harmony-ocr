name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Public repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify repository policy
        shell: pwsh
        run: ./scripts/verify-public-repository.ps1 -RepositoryRoot $PWD

      - name: Download and verify Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location --output "${RUNNER_TEMP}/${archive}" "${release}/${archive}"
          curl --fail --silent --show-error --location --output "${RUNNER_TEMP}/gitleaks-checksums.txt" "${release}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep -F "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" "${RUNNER_TEMP}/gitleaks-checksums.txt"
          printf '%s  %s\n' "${GITLEAKS_LINUX_X64_SHA256}" "${RUNNER_TEMP}/${archive}" | sha256sum --check --strict -
          mkdir "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          "${RUNNER_TEMP}/gitleaks/gitleaks" version

      - name: Scan worktree and checked-out history
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/gitleaks/gitleaks" dir --redact --no-banner .
          "${RUNNER_TEMP}/gitleaks/gitleaks" git --redact --no-banner .

  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: Run backend tests
        run: mvn -B --no-transfer-progress -f server/pom.xml test

  admin:
    name: Admin console checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-console/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Install locked dependencies
        run: npm --prefix admin-console ci --registry=https://registry.npmjs.org

      - name: Type-check admin console
        run: npm --prefix admin-console run typecheck

      - name: Build admin console
        run: npm --prefix admin-console run build

      - name: Audit high-severity npm advisories
        run: npm --prefix admin-console audit --registry=https://registry.npmjs.org --audit-level=high

      - name: Reject generated asset drift
        run: git diff --exit-code -- server/src/main/resources/static/admin

      - name: Verify generated asset path set
        shell: pwsh
        run: ./scripts/verify-public-repository.ps1 -RepositoryRoot $PWD -VerifyGeneratedAdminAssets

  sbom:
    name: SBOM and dependency licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: Set up Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-console/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Generate and audit dependency inventories
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'harmony-ocr-sbom'
          ./scripts/generate-sbom.ps1 -RepositoryRoot $PWD -OutputDirectory $destination
          ./scripts/audit-dependency-licenses.ps1 -RepositoryRoot $PWD -SbomDirectory $destination

      - name: Reject repository-local SBOM output
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: never
          fail-on-severity: high
