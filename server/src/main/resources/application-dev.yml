spring:
  servlet:
    multipart:
      max-file-size: ${FILE_UPLOAD_MAX_SIZE:10485760B}
      max-request-size: ${FILE_UPLOAD_MAX_SIZE:10485760B}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/harmony_ocr?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:harmony_ocr}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: ${MINIO_BUCKET:harmony-ocr}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:30}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}
  file:
    max-size-bytes: ${FILE_UPLOAD_MAX_SIZE_BYTES:10485760}
