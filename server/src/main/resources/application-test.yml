spring:
  servlet:
    multipart:
      max-file-size: 10485760B
      max-request-size: 10485760B
  datasource:
    url: jdbc:h2:mem:harmony_ocr_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

minio:
  endpoint: http://localhost:9000
  access-key: test
  secret-key: test
  bucket: harmony-ocr-test

app:
  jwt:
    secret: test-only-placeholder-not-for-production-at-least-32-characters
    access-token-ttl-minutes: 30
    refresh-token-ttl-days: 30
  file:
    max-size-bytes: 10485760
  activation-code:
    pepper: test-only-activation-code-pepper-not-for-production
  ai:
    byok:
      encryption-secret: test-only-byok-encryption-secret-not-for-production
